server {
  listen 9100;
  server_name _;
  root /usr/share/nginx/html;

  # The account layer. One bundle, every product, no per-product configuration —
  # which product a customer is heading for arrives in a query string.

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so they can be cached hard and forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Repeated, not inherited.
    #
    # nginx drops every add_header from an outer block as soon as a block declares
    # one of its own, so the server-level security headers below vanish for any
    # location that sets a Cache-Control. The sign-in page was being served without
    # clickjacking protection because of exactly that rule.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  # The document itself is never cached: it is what points at the hashed assets, so
  # a cached index.html is how a returning visitor gets last week's app.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    # Repeated, not inherited.
    #
    # nginx drops every add_header from an outer block as soon as a block declares
    # one of its own, so the server-level security headers below vanish for any
    # location that sets a Cache-Control. The sign-in page was being served without
    # clickjacking protection because of exactly that rule.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # A single-page app: unknown paths are routes, not missing files. `/signin`,
  # `/verify` and `/products` all have to reach index.html on a cold load, which is
  # exactly how a customer arrives — redirected from a product.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Belt and braces alongside the meta tags in index.html.
  add_header X-Content-Type-Options "nosniff" always;
  # Never framed, by anyone.
  #
  # A sign-in page inside someone else's iframe is a clickjacking target: the
  # customer types their password into what they think is our page and cannot see
  # whose page is actually on top.
  add_header X-Frame-Options "DENY" always;
  # No referrer off-site at all.
  #
  # URLs here carry `?next=`, and a verification screen's URL says which account is
  # being verified. Neither belongs in another site's logs.
  add_header Referrer-Policy "no-referrer" always;
}
